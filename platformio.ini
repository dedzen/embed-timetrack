[platformio]
boards_dir = boards

[env:lilygo-t-embed-cc1101]
platform = espressif32@6.13.0
board = T_Embed_PN532
framework = arduino

monitor_speed = 115200
upload_speed = 115200
monitor_filters = esp32_exception_decoder
extra_scripts = pre:scripts/load_env.py
lib_ldf_mode = deep+

lib_deps =
    bodmer/TFT_eSPI@^2.5.43
    lvgl/lvgl@^8.3.11
    SD

build_flags =
    -DARDUINO_USB_CDC_ON_BOOT=1
    -D USER_SETUP_LOADED=1
    -D ST7789_DRIVER=1
    -D USE_HSPI_PORT
    -D TFT_WIDTH=170
    -D TFT_HEIGHT=320
    -D TFT_INVERSION_ON
    -D TFT_BL=21
    -D TFT_MISO=10
    -D TFT_MOSI=9
    -D TFT_SCLK=11
    -D TFT_CS=41
    -D TFT_DC=16
    -D TFT_RST=-1
    -D LOAD_GLCD=1
    -D LOAD_FONT2=1
    -D LOAD_FONT4=1
    -D LOAD_FONT6=1
    -D LOAD_FONT7=1
    -D LOAD_FONT8=1
    -D LOAD_GFXFF=1
    -D SMOOTH_FONT
    -D SPI_FREQUENCY=40000000
    -D SPI_READ_FREQUENCY=20000000
    -D LV_CONF_INCLUDE_SIMPLE
